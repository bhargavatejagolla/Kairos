services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kairos-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - kairos-network

  postgres:
    image: postgres:17

    container_name: kairos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - kairos-network

  redis:
    image: redis:7-alpine
    container_name: kairos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kairos-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kairos-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.background.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - kairos-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kairos-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.background.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - kairos-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kairos-flower
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.background.celery_app flower --port=5555
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - kairos-network

volumes:
  postgres-data:
  redis-data:

networks:
  kairos-network:
    driver: bridge