services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kairos-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - kairos-network

  postgres:
    image: postgres:17

    container_name: kairos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - kairos-network

volumes:
  postgres-data:

networks:
  kairos-network:
    driver: bridge