apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kairos-backend-monitor
  namespace: kairos
  labels:
    release: prometheus # standard label for prometheus operator to pick this up
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - kairos
