apiVersion: v1
kind: ConfigMap
metadata:
  name: kairos-config
  namespace: kairos
data:
  # Base shared configuration for backend and workers
  APP_ENV: "production"
  APP_NAME: "kairos"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  # Any other non-sensitive configurations go here
