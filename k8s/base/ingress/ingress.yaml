apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kairos-ingress
  namespace: kairos
  annotations:
    # Use traefik for k3d by default, can be overridden to ingress-nginx in prod overlay
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.kairos.local
        - api.kairos.local
      secretName: kairos-tls-secret
  rules:
    - host: app.kairos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.kairos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
