groups:
  - name: kairos_slos
    rules:
      - record: job:kairos_http_requests_total:rate5m
        expr: rate(kairos_http_requests_total[5m])

      - record: job:kairos_http_request_duration_seconds:p99
        expr: histogram_quantile(0.99, rate(kairos_http_request_duration_seconds_bucket[5m]))

      - record: job:kairos_incidents_created:rate5m
        expr: rate(kairos_incidents_created_total[5m])

      - record: job:kairos_alerts_triggered:rate5m
        expr: rate(kairos_alerts_triggered_total[5m])

  - name: kairos_alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(kairos_http_requests_total{status=~"5.."}[5m])) / sum(rate(kairos_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate"
          description: "Over 5% of HTTP requests are failing with 5xx status codes over the last 5 minutes."

      - alert: HighLatency
        expr: job:kairos_http_request_duration_seconds:p99 > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API Latency"
          description: "The 99th percentile API latency is over 2 seconds."
